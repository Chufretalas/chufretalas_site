<!DOCTYPE html>
<script src="./wasm_exec.js"></script>
<script>

    async function loadWasm(url, importObject) {
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return await WebAssembly.instantiateStreaming(response, importObject);
        } catch (e) {
            console.warn('WebAssembly.instantiateStreaming failed. Falling back to WebAssembly.instantiate.');
            const response = await fetch(url);
            const buffer = await response.arrayBuffer();
            return await WebAssembly.instantiate(buffer, importObject);
        }
    }

    const go = new Go();
    loadWasm('./falling_sand_v1.wasm.br', go.importObject)
        .then(result => {
            go.run(result.instance);
        })
        .catch(error => {
            console.error('Error loading WebAssembly module:', error);
        });
</script>
